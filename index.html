<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Quintette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%23ffd23f'/%3E%3Crect x='8' y='8' width='48' height='48' rx='10' fill='%2317120a'/%3E%3Cpath d='M41 17H25l-2 15c3-2 6-3 9-3 6 0 10 4 10 9s-4 10-11 10c-4 0-7-1-9-3' fill='none' stroke='%23ffd23f' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Plateau en verre posé sur un paysage animé (canvas). Colonne large sur PC, compacte sur mobile :
   HUD → carte (question, zone d'atterrissage, 5 mots en pendu) → saisie → clavier AZERTY. */
:root{
  --glass:rgba(8,12,26,.44); --glass2:rgba(255,255,255,.08); --line:rgba(255,255,255,.16);
  --ink:#f7f4ec; --dim:rgba(247,244,236,.66);
  --accent:#ffd23f; --accent-ink:#17120a;
  --ok:#43dd86; --ok-ink:#05230f; --bad:#ff5a5f; --warn:#ffad3b; --warn-ink:#2a1700;
  --f-disp:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow","Segoe UI",sans-serif;
  --cell:min(54px,calc((100vw - 120px) / var(--n,12)));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:#0b1426;color:var(--ink);font-family:var(--f-body);font-size:16px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px;display:flex;flex-direction:column;gap:12px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:16px;-webkit-backdrop-filter:blur(5px) saturate(1.15);backdrop-filter:blur(5px) saturate(1.15);box-shadow:0 10px 30px rgba(0,0,0,.25)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* HUD */
.hud{display:flex;align-items:center;gap:14px;padding:10px}
.coins{flex:none;width:76px;height:76px;border:3px solid var(--accent);border-radius:12px;background:rgba(0,0,0,.35);box-shadow:4px 4px 0 var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.coins b{font:400 24px/1 var(--f-disp);color:var(--accent);font-variant-numeric:tabular-nums}
.coins b.s{font-size:18px}.coins b.xs{font-size:13px}
.coins small{font:700 10px/1 var(--f-cond);letter-spacing:.16em;color:var(--dim)}
.coins.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.15) rotate(-3deg)}}
.lvl{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.lvl-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lvl-num{font:400 24px/1 var(--f-disp);white-space:nowrap}
.chap{font:700 13px/1 var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:14px;border-radius:4px;background:rgba(255,255,255,.1);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,color-mix(in srgb,var(--accent) 78%,#fff) 8px 16px);transition:width .5s ease}
.lvl-sub{font:600 14px/1 var(--f-cond);color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.save-btn{flex:none;width:76px;height:76px;border-radius:12px;border:2px solid var(--line);background:var(--glass2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:700 11px/1 var(--f-cond);letter-spacing:.12em;color:var(--dim)}
.save-btn svg{width:24px;height:24px;stroke:var(--ink)}
.save-btn:hover{border-color:var(--accent)}

/* Carte question + mots */
.board{padding:20px 22px 22px}
.qmeta{display:flex;align-items:center;gap:10px;font:700 13px/1 var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.cat{background:var(--accent);color:var(--accent-ink);padding:5px 9px 4px;border-radius:4px}
.diff{display:flex;gap:3px}
.diff i{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.12);border:1px solid var(--line)}
.diff i.on{background:var(--ink);border-color:var(--ink)}
.qtext{margin:12px 0 0;font-weight:800;font-size:clamp(21px,4.4vw,36px);line-height:1.12;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.stage{height:64px;margin:10px 0 6px;border-radius:12px;border:2px dashed rgba(255,255,255,.14);display:grid;place-items:center;font:600 14px var(--f-cond);letter-spacing:.06em;color:var(--dim)}
.slots{display:flex;flex-direction:column;gap:clamp(10px,1.8vw,16px);margin-top:22px}
.slot{display:flex;align-items:flex-end;gap:10px}
.slot-n{flex:none;width:22px;font:400 16px/1 var(--f-disp);color:var(--dim);text-align:center;padding-bottom:6px}
.tiles{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--n),var(--cell));gap:clamp(3px,.8vw,7px)}
.t{height:calc(var(--cell) * 1.15);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:400 calc(var(--cell) * .62)/1 var(--f-disp);border-bottom:4px solid var(--ink);color:var(--ink)}
.t.off{border-bottom-color:rgba(255,255,255,.14);border-bottom-width:3px}
.t.gap{border-bottom-color:transparent}
.t.hint{color:var(--accent)}
.slot.found .t.on{color:var(--ok);border-bottom-color:var(--ok)}
.slot.hinted .t.on{color:var(--warn);border-bottom-color:var(--warn)}
.slot.missed .t.on{color:rgba(255,255,255,.5);border-bottom-color:rgba(255,255,255,.35)}
.t.flip{animation:drop .4s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes drop{from{transform:translateY(-14px) scale(1.3);opacity:0}to{transform:none;opacity:1}}
.slot.ping .tiles{animation:ping .5s}
@keyframes ping{40%{transform:scale(1.03)}}

/* Saisie + outils */
.inrow{display:flex;gap:10px}
#answer{flex:1;min-width:0;font:800 22px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--glass);color:var(--ink);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
#answer::placeholder{color:var(--dim);font-weight:600;text-transform:none;letter-spacing:0}
#answer:focus{outline:none;border-color:var(--accent)}
#answer.buzz{animation:buzz .32s;border-color:var(--bad)}
@keyframes buzz{15%,55%{transform:translateX(-7px)}35%,75%{transform:translateX(7px)}}
.btn{border:0;border-radius:12px;padding:14px 20px;font:800 17px/1 var(--f-body)}
.btn-go{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.btn-go:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.tools{display:flex;gap:10px}
.btn-ghost{flex:1;background:var(--glass);border:2px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.btn-ghost:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cost{font:400 14px/1 var(--f-disp);background:var(--accent);color:var(--accent-ink);padding:5px 7px 4px;border-radius:5px}
.skip{flex:0 0 auto;animation:appear .35s ease both}
@keyframes appear{from{transform:scale(.7);opacity:0}}
.next{width:100%;font-size:20px;padding:18px}
.done-line{text-align:center;font:700 15px var(--f-cond);letter-spacing:.06em;color:var(--ink);margin-bottom:10px;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* Clavier */
.kbd{padding:10px;display:flex;flex-direction:column;gap:7px}
.krow{display:flex;gap:6px;justify-content:center}
.key{flex:1;max-width:66px;height:clamp(42px,6.2vw,56px);border-radius:8px;border:0;background:rgba(255,255,255,.16);color:var(--ink);font:400 clamp(14px,2.4vw,20px)/1 var(--f-disp);box-shadow:0 3px 0 rgba(0,0,0,.35);transition:background .25s,opacity .25s}
.key:hover{background:rgba(255,255,255,.26)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.key.live{background:color-mix(in srgb,var(--accent) 30%,rgba(255,255,255,.12))}
.key.dead,.key:disabled{opacity:.25;background:rgba(255,255,255,.06);cursor:not-allowed;box-shadow:none;transform:none}
.key.wide{flex:2.2;max-width:180px;font:800 15px/1 var(--f-body);letter-spacing:.06em}
.key.go{background:var(--accent);color:var(--accent-ink)}
.key.mode{flex:1.2;max-width:110px;font:400 clamp(13px,2vw,17px)/1 var(--f-disp)}
.kbd-legend{display:flex;gap:16px;justify-content:center;font:600 13px var(--f-cond);color:var(--dim);letter-spacing:.04em}
.kbd-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Animations */
.fly{position:fixed;left:0;top:0;z-index:50;pointer-events:none;white-space:nowrap;font:800 clamp(20px,3vw,28px)/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:12px 18px;border-radius:12px;background:var(--ink);color:#141820;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.fly.ok{background:var(--ok);color:var(--ok-ink)}
.fly.bad{background:var(--bad);color:#fff}
.fly.warn{background:var(--warn);color:var(--warn-ink)}
.fly.dup{background:#2a3350;color:var(--ink)}
.fly .v{font-family:var(--f-disp);font-weight:400;margin-right:10px}
.fly small{display:block;margin-top:6px;font:700 13px/1 var(--f-cond);letter-spacing:.06em;text-transform:none}
.puff{position:fixed;left:0;top:0;z-index:49;width:16px;height:16px;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.85)}
.plus{position:fixed;left:0;top:0;z-index:60;pointer-events:none;font:400 24px/1 var(--f-disp);color:var(--accent);text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.banner{position:fixed;inset:0;z-index:80;display:grid;place-items:center;pointer-events:none;text-align:center;padding:16px}
.banner div{animation:pop 2.4s cubic-bezier(.2,.9,.3,1.1) both}
.banner b{display:block;font:400 clamp(44px,11vw,96px)/1 var(--f-disp);color:var(--accent);text-shadow:5px 5px 0 rgba(0,0,0,.45)}
.banner span{display:block;margin-top:12px;font:800 clamp(17px,3vw,26px)/1.2 var(--f-body);text-shadow:0 2px 10px rgba(0,0,0,.7)}
@keyframes pop{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.08);opacity:1}25%{transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:#1b2238;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font:700 15px var(--f-body);max-width:calc(100% - 32px);text-align:center}

/* Fenêtre sauvegarde */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(520px,100%);max-height:calc(100% - 16px);overflow:auto;background:#141a2e;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font:400 22px/1 var(--f-disp);color:var(--accent)}
.sheet h3{margin:8px 0 0;font:700 13px/1 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.sheet p{margin:0;line-height:1.45;color:var(--dim);font-size:15px}
.code{font:400 clamp(28px,8vw,40px)/1 var(--f-disp);letter-spacing:.08em;text-align:center;padding:16px;border-radius:12px;background:rgba(0,0,0,.35);border:2px dashed var(--accent);color:var(--accent);user-select:all;-webkit-user-select:all}
.where{font:700 15px var(--f-cond);letter-spacing:.06em;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
#mInput{width:100%;font:400 24px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:14px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink)}
.msg{font:700 14px var(--f-body);min-height:1em}
.msg.err{color:var(--bad)}.msg.okc{color:var(--ok)}
.x{align-self:flex-end;background:none;border:0;color:var(--dim);font:700 14px var(--f-body);padding:4px}
.danger{background:transparent;border:2px solid color-mix(in srgb,var(--bad) 60%,transparent)}
@media (max-width:560px){.coins,.save-btn{width:62px;height:62px}.coins b{font-size:19px}.lvl-num{font-size:18px}.board{padding:16px 14px 18px}.krow{gap:4px}.kbd{padding:8px 6px}.tiles{gap:3px}:root{--cell:min(54px,calc((100vw - 90px) / var(--n,12)))}.t{border-bottom-width:3px;padding-bottom:4px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <header class="hud glass">
    <div class="coins" id="coins" aria-label="Pièces"><b id="coinNum">50</b><small>PIÈCES</small></div>
    <div class="lvl">
      <div class="lvl-top"><span class="lvl-num" id="lvlNum">NIV. 1</span><span class="chap" id="chap"></span></div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="lvl-sub" id="lvlSub"></div>
    </div>
    <button class="save-btn" id="saveBtn" aria-label="Exporter ou importer"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5-5 5 5"/><path d="M12 5v10"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>CODE</button>
  </header>

  <section class="board glass">
    <div class="qmeta"><span class="cat" id="qcat"></span><span class="diff" id="qdiff"></span></div>
    <h1 class="qtext" id="qtext">Chargement…</h1>
    <div class="slots" id="slots" aria-label="Les 5 réponses"></div>
  </section>

  <div id="playUI" style="display:flex;flex-direction:column;gap:10px">
    <form class="inrow" id="form" autocomplete="off">
      <input id="answer" type="text" placeholder="Tape ta réponse…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Ta réponse">
      <button class="btn btn-go" type="submit">OK</button>
    </form>
    <div class="tools">
      <button class="btn btn-ghost" id="hintBtn" type="button">Indice : 1 lettre par mot <span class="cost">15</span></button>
      <button class="btn btn-ghost skip" id="skipBtn" type="button" hidden>Passer <span class="cost">30</span></button>
    </div>
  </div>
  <div id="doneUI" hidden>
    <div class="done-line" id="doneLine"></div>
    <button class="btn btn-go next" id="nextBtn" type="button">Question suivante →</button>
  </div>

  <div class="kbd glass" id="kbd" aria-label="Clavier"></div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="x" id="mClose" type="button">Fermer ✕</button>
    <h2 id="mTitle">Exporter</h2>
    <p>Trois blocs de lettres : ton niveau, ta phase et tes pièces. Ils sont liés entre eux, donc si tu changes une seule lettre, le code ne marche plus.</p>
    <div class="code" id="mCode"></div>
    <div class="where" id="mWhere"></div>
    <div class="row"><button class="btn btn-go" id="mCopy" type="button">Copier le code</button></div>
    <h3>Importer</h3>
    <input id="mInput" type="text" maxlength="14" placeholder="ABC-DE-FGHI" autocomplete="off" spellcheck="false" aria-label="Code à importer">
    <div class="msg" id="mMsg"></div>
    <div class="row"><button class="btn btn-ghost" id="mLoad" type="button">Vérifier le code</button></div>
    <div class="row" id="mConfirmRow" hidden><button class="btn btn-go" id="mConfirm" type="button">Charger cette partie</button></div>
    <h3>Nouvelle partie</h3>
    <div class="row"><button class="btn danger" id="mReset" type="button">Tout recommencer au niveau 1</button></div>
    <div class="row" id="mResetRow" hidden><button class="btn danger" id="mResetYes" type="button" style="border-color:var(--bad)">Oui, tout effacer</button></div>
    <p style="font-size:13px">La partie est aussi enregistrée toute seule dans ce navigateur.</p>
  </div>
</div>
<script>
/* ---------- règles + texte ---------- */
const need = L => L<=30?10 : L<=60?20 : L<=90?30 : L<=120?40 : 50;
const ROM=["","i","ii","iii","iv","v","vi","vii","viii","ix","x","xi","xii","xiii","xiv","xv","xvi","xvii","xviii","xix","xx"];
const STOP=new Set(["le","la","les","l","un","une","des","du","de","d"]);
function deacc(s){return String(s).toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").normalize("NFD").replace(/[̀-ͯ]/g,"");}
function norm(s){
  const t=deacc(s).split(/[^a-z0-9]+/).filter(Boolean)
    .map(w=>/^1ere?$/.test(w)?"ier":(/^\d+$/.test(w)&&+w>0&&+w<=20?ROM[+w]:w));
  while(t.length>1&&STOP.has(t[0]))t.shift();
  return t.join("");
}
const stem=s=>s.length>3?s.replace(/[sx]$/,""):s;
const same=(a,b)=>a===b||stem(a)===stem(b);
function lev(a,b){
  const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}
  return p[n];
}
function near(a,b){
  const L=Math.max(a.length,b.length);if(L<5)return false;
  const lim=L>=9?2:1;if(Math.abs(a.length-b.length)>lim)return false;
  return lev(a,b)<=lim;
}

/* ---------- code de sauvegarde : NIVEAU-PHASE-PIÈCES en lettres (ABC-DE-FGHI) ---------- */
const CODEC=(()=>{
  const AL="QWHTKZMBXRDPLFVJNGSACYEUIO";
  const G=[{m:17576,a:7919,b:4211,n:3},{m:676,a:461,b:333,n:2},{m:456976,a:104729,b:271828,n:4}];
  const inv=(a,m)=>{let[t,nt,r,nr]=[0,1,m,a%m];while(nr){const q=Math.floor(r/nr);[t,nt]=[nt,t-q*nt];[r,nr]=[nr,r-q*nr];}return(t%m+m)%m;};
  G.forEach(g=>g.ia=inv(g.a,g.m));
  const hash=(L,P,C)=>{let h=Math.imul(L*2654435761^P*40503^C*2246822519,0x27d4eb2d);h^=h>>>15;h=Math.imul(h,0x165667b1);h^=h>>>13;return(h>>>20)&1023;};
  const mulmod=(x,a,m)=>Number(BigInt(x)*BigInt(a)%BigInt(m));
  function enc(v,g){let x=(mulmod(v,g.a,g.m)+g.b)%g.m,s="";for(let i=0;i<g.n;i++){s=AL[x%26]+s;x=Math.floor(x/26);}return s;}
  function dec(s,g){if(s.length!==g.n)return-1;let x=0;for(const ch of s){const k=AL.indexOf(ch);if(k<0)return-1;x=x*26+k;}return mulmod((x-g.b+g.m)%g.m,g.ia,g.m);}
  function encode(level,phase,coins){
    const L=Math.min(Math.max(level|0,1),2048)-1,P=Math.min(Math.max(phase|0,0),63),C=Math.min(Math.max(Math.round(coins/5),0),16383),H=hash(L,P,C);
    return[enc(L*8+(H&7),G[0]),enc(P*8+((H>>3)&7),G[1]),enc(C*16+(H>>6),G[2])].join("-");
  }
  function decode(str){
    const parts=String(str).toUpperCase().replace(/[^A-Z]+/g," ").trim().split(" ");
    if(parts.length!==3)return null;
    const v=parts.map((p,i)=>dec(p,G[i]));if(v.some(x=>x<0))return null;
    if(v[0]>=16384||v[1]>=512||v[2]>=262144)return null;
    const L=v[0]>>3,P=v[1]>>3,C=v[2]>>4,H=hash(L,P,C);
    if((v[0]&7)!==(H&7)||(v[1]&7)!==((H>>3)&7)||(v[2]&15)!==(H>>6))return null;
    const level=L+1;if(P>=need(level))return null;

function size(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  [cv,backC,frontC].forEach(k=>{k.width=Math.round(W*dpr);k.height=Math.round(H*dpr);});}
function paint(){
  if(!W)size();R=mul(seed*7919+kind*31);shoot=[];const sc=SCENES[kind%10];
  const b=backC.getContext("2d"),f=frontC.getContext("2d");
  b.setTransform(dpr,0,0,dpr,0,0);f.setTransform(dpr,0,0,dpr,0,0);b.clearRect(0,0,W,H);f.clearRect(0,0,W,H);
  sc.back(b);if(sc.front)sc.front(f);P=sc.init?sc.init():[];frame(performance.now(),true);
}
function frame(t,force){
  const sc=SCENES[kind%10];const dt=Math.min(60,t-(last||t));
  if(!force&&dt<30&&last){raf=requestAnimationFrame(frame);return;}
  last=t;ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(backC,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);
  if(sc.mid)sc.mid(ctx,t,reduced?0:dt);
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(frontC,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);
  if(sc.top)sc.top(ctx,t,reduced?0:dt);
  if(!reduced&&!document.hidden){cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);}
}

(()=>{
const $=id=>document.getElementById(id);
const KEY="quintette.v2",BANKV=4;
const reduced=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const ROMAN=["","","II","III","IV","V","VI","VII","VIII","IX","X"];
function chapter(L){const i=Math.floor((L-1)/10),s=Scene.info(i),r=Math.floor(i/10)+1;return{idx:i,accent:s.accent,label:s.name+(r>1?" "+(ROMAN[r]||r):"")};}
function applyChapter(){const c=chapter(S.level);document.documentElement.style.setProperty("--accent",c.accent);
  $("chap").textContent="Ch."+(c.idx+1)+" · "+c.label;Scene.set(c.idx,S.level);}

/* ---------- questions ---------- */
const parseList=s=>s?s.split(";").map(a=>{const al=a.split("/").map(x=>x.trim()).filter(Boolean);
  return{disp:al[0],keys:[...new Set(al.map(norm))].filter(Boolean)};}):[];
const BANK=QB.map((line,id)=>{const p=line.split("|");return{id,d:+p[0],cat:p[1],q:p[2],cands:parseList(p[3]),extra:parseList(p[4]||"")};});
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const weights=L=>L<=5?[.6,.3,.1]:L<=20?[.4,.4,.2]:L<=60?[.3,.4,.3]:[.25,.35,.4];
const isGap=ch=>/[\s'’\-.]/.test(ch);

/* ---------- état ---------- */
const fresh=()=>({level:1,phase:0,coins:50,seen:[],last:"",cur:null,bankV:4});
let S=fresh();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.level>0){S=Object.assign(fresh(),r);if(S.bankV!==BANKV){S.seen=[];S.cur=null;S.bankV=BANKV;}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const curB=()=>BANK[S.cur.id];
const ans=k=>curB().cands[S.cur.slots[k]];
const isDone=()=>S.cur.st.every(x=>x>0);

function pickQ(){
  const seen=new Set(S.seen);let pool=BANK.filter(b=>!seen.has(b.id));
  if(!pool.length){S.seen=[];pool=BANK.slice();}
  const w=weights(S.level),r=Math.random(),d=r<w[0]?1:r<w[0]+w[1]?2:3;
  let sub=pool.filter(b=>b.d===d);if(!sub.length)sub=pool;
  const other=sub.filter(b=>b.cat!==S.last);if(other.length)sub=other;
  const b=sub[Math.floor(Math.random()*sub.length)];
  const slots=shuffle(b.cands.map((_,i)=>i)).slice(0,5).sort((x,y)=>x-y);
  S.seen.push(b.id);S.last=b.cat;
  S.cur={id:b.id,slots,st:[0,0,0,0,0],rev:[[],[],[],[],[]],t0:Date.now()};
  save();
}
function progress(n){
  const before=S.level;S.phase+=n;
  while(S.phase>=need(S.level)){S.phase-=need(S.level);S.level++;}
  if(S.level===before)return null;
  return{level:S.level,newChap:chapter(before).idx!==chapter(S.level).idx};
}

/* ---------- rendu ---------- */
function renderHud(){
  const c=$("coinNum");c.textContent=S.coins;c.className=S.coins>=10000?"xs":S.coins>=1000?"s":"";
  $("lvlNum").textContent="NIV. "+S.level;
  const n=need(S.level);$("barFill").style.width=(S.phase/n*100)+"%";
  $("lvlSub").textContent="Phase "+S.phase+" / "+n+" · ensuite niveau "+(S.level+1);
  $("hintBtn").disabled=isDone()||S.coins<15;$("hintBtn").title=S.coins<15?"Il te faut 15 pièces":"";
}
function sizeCells(){
  const box=$("slots"),n=+box.dataset.n||12,w=box.clientWidth-32,gap=innerWidth<=560?3:Math.min(7,Math.max(3,innerWidth*.008));
  box.style.setProperty("--cell",Math.max(14,Math.min(54,Math.floor((w-gap*(n-1))/n)))+"px");
}
function renderQ(){
  const b=curB();
  $("qcat").textContent=b.cat;
  $("qdiff").innerHTML=[1,2,3].map(i=>'<i class="'+(i<=b.d?"on":"")+'"></i>').join("");
  $("qdiff").title=["","Facile","Moyen","Difficile"][b.d];
  $("qtext").textContent=b.q;
  const list=S.cur.slots.map(i=>b.cands[i]);
  const N=Math.max(10,...list.map(a=>[...a.disp].length));
  const box=$("slots");box.innerHTML="";box.dataset.n=N;
  list.forEach((a,k)=>{
    const row=document.createElement("div");row.className="slot";row.id="slot"+k;
    row.innerHTML='<span class="slot-n">'+(k+1)+'</span><div class="tiles" style="--n:'+N+'"></div>';
    const tiles=row.querySelector(".tiles"),chars=[...a.disp.toUpperCase()];let count=0;
    for(let i=0;i<N;i++){const t=document.createElement("span");
      if(i<chars.length){if(isGap(chars[i]))t.className="t gap";else{t.className="t on";t.dataset.ch=chars[i];t.dataset.i=i;count++;}}
      else t.className="t off";
      tiles.appendChild(t);}
    row.dataset.count=count;row.dataset.disp=a.disp;
    box.appendChild(row);paintSlot(k,false);
  });
  sizeCells();setDoneUI();renderKeys();skipTick();
}
function paintSlot(k,anim,only){
  const row=$("slot"+k);if(!row)return;const st=S.cur.st[k],rev=S.cur.rev[k];
  row.classList.remove("found","hinted","missed");if(st)row.classList.add(["","found","hinted","missed"][st]);
  row.setAttribute("aria-label","Réponse "+(k+1)+" : "+(st?row.dataset.disp:row.dataset.count+" lettres"));
  row.querySelectorAll(".t.on").forEach((t,j)=>{const i=+t.dataset.i,show=st>0||rev.includes(i);
    const was=t.textContent!=="";t.textContent=show?t.dataset.ch:"";t.classList.toggle("hint",!st&&rev.includes(i));
    if(anim&&show&&!reduced&&(!was||st)&&(!only||only.includes(i))){t.style.animationDelay=(only?0:j*45)+"ms";t.classList.remove("flip");void t.offsetWidth;t.classList.add("flip");}});
  if(anim&&st){row.classList.remove("ping");void row.offsetWidth;row.classList.add("ping");}
}
function setDoneUI(){
  const d=isDone();$("playUI").hidden=d;$("playUI").style.display=d?"none":"flex";$("doneUI").hidden=!d;
  if(d){const st=S.cur.st,f=st.filter(x=>x===1).length,h=st.filter(x=>x===2).length,m=st.filter(x=>x===3).length;
    $("doneLine").textContent=[f+" trouvée"+(f>1?"s":""),h?h+" révélée"+(h>1?"s":"")+" par indices":"",m?m+" passée"+(m>1?"s":""):""].filter(Boolean).join(" · ");}
  renderHud();renderKeys();
}

/* ---------- clavier ---------- */
const PAGES={abc:["AZERTYUIOP","QSDFGHJKLM","WXCVBN'-"],num:["1234567890","'-"]};
let kbMode="abc";
const symOf=ch=>ch==="’"?"'":ch;
function mkKey(k,label,cls){const b=document.createElement("button");b.type="button";b.className="key"+(cls?" "+cls:"");b.textContent=label||k;b.dataset.k=k;return b;}
function buildKbd(){
  const k=$("kbd");k.innerHTML="";
  PAGES[kbMode].forEach((r,ri,all)=>{const row=document.createElement("div");row.className="krow";
    [...r].forEach(ch=>row.appendChild(mkKey(ch)));
    if(ri===all.length-1){const b=mkKey("BS","⌫");b.setAttribute("aria-label","Effacer");row.appendChild(b);}
    k.appendChild(row);});
  const last=document.createElement("div");last.className="krow";
  const t=mkKey("MODE",kbMode==="abc"?"123":"ABC","wide mode");t.setAttribute("aria-label",kbMode==="abc"?"Clavier des chiffres":"Clavier des lettres");
  last.appendChild(t);last.appendChild(mkKey(" ","ESPACE","wide"));last.appendChild(mkKey("OK","VALIDER","wide go"));
  k.appendChild(last);
  const lg=document.createElement("div");lg.className="kbd-legend";
  lg.innerHTML='<span><i style="background:color-mix(in srgb,var(--accent) 45%,#555)"></i>utile pour les mots restants</span><span><i style="background:rgba(255,255,255,.12)"></i>ne sert plus</span>';
  k.appendChild(lg);renderKeys();
}
$("kbd").addEventListener("click",e=>{const b=e.target.closest(".key");if(!b||b.disabled)return;press(b.dataset.k);});
function press(k){
  if(isDone()||!$("modal").hidden)return;const inp=$("answer");
  if(k==="MODE"){kbMode=kbMode==="abc"?"num":"abc";buildKbd();return;}
  if(k==="OK")return submit();
  if(k==="BS"){inp.value=inp.value.slice(0,-1);return;}
  if(blocked(k))return buzz();
  inp.value+=/[A-Z]/.test(k)?k.toLowerCase():k;
}
function liveSet(){
  const live=new Set();
  if(S.cur&&!isDone())S.cur.st.forEach((st,k)=>{if(st)return;const d=ans(k).disp;
    deacc(d).toUpperCase().replace(/[^A-Z0-9]/g,"").split("").forEach(c=>live.add(c));
    [...d].forEach(c=>{c=symOf(c);if(c===" "||c==="-"||c==="'")live.add(c);});});
  return live;
}
function renderKeys(){
  const live=liveSet();let anyNum=false;
  document.querySelectorAll(".key").forEach(b=>{const c=b.dataset.k;
    if(c==="MODE"){return;}
    if(!(c.length===1&&/[A-Z0-9' -]/.test(c)))return;
    const ok=live.has(c);b.classList.toggle("live",ok&&c!==" ");b.classList.toggle("dead",!ok);b.disabled=!ok;});
  for(const c of live)if(/[0-9]/.test(c))anyNum=true;
  const m=document.querySelector('.key[data-k="MODE"]');if(m)m.classList.toggle("live",kbMode==="abc"&&anyNum);
}
function buzz(){const i=$("answer");i.classList.remove("buzz");void i.offsetWidth;i.classList.add("buzz");clearTimeout(buzz.t);buzz.t=setTimeout(()=>i.classList.remove("buzz"),340);if(navigator.vibrate)try{navigator.vibrate(40);}catch(e){}}
function blocked(str){const live=liveSet();
  return [...str].some(ch=>{ch=symOf(ch);
    if(ch===" "||ch==="-"||ch==="'")return !live.has(ch);
    const b=deacc(ch).toUpperCase().replace(/[^A-Z0-9]/g,"");
    return b.split("").some(c=>!live.has(c));});}
/* ---------- vérification ---------- */
function judge(raw){
  const n=norm(raw);if(!n)return{type:"bad"};
  const b=curB(),sl=S.cur.slots,others=b.cands.filter((_,i)=>!sl.includes(i)).concat(b.extra);
  const hit=f=>{for(let k=0;k<5;k++)if(b.cands[sl[k]].keys.some(x=>f(x,n)))return S.cur.st[k]?{type:"dup",k}:{type:"ok",k};
    return others.some(a=>a.keys.some(x=>f(x,n)))?{type:"warn"}:null;};
  return hit(same)||hit(near)||{type:"bad"};
}

/* ---------- animations ---------- */
const clampX=(x,w)=>Math.max(8,Math.min(innerWidth-w-8,x));
const wait=ms=>new Promise(r=>setTimeout(r,reduced?0:ms));
const play=(el,kf,o)=>reduced?Promise.resolve():new Promise(r=>{el.animate(kf,Object.assign({fill:"forwards"},o)).onfinish=r;});
function centerOn(el,f){const t=el.getBoundingClientRect();return[clampX(t.left+(t.width-f.offsetWidth)/2,f.offsetWidth),Math.max(8,t.top+(t.height-f.offsetHeight)/2)];}
async function launch(text,cls,note,toRow){
  const f=document.createElement("div");f.className="fly "+cls;f.textContent=text;
  if(note){const n=document.createElement("small");n.textContent=note;f.appendChild(n);}
  document.body.appendChild(f);
  const q=$("qtext").getBoundingClientRect(),b=$("slots").getBoundingClientRect();
  const x=clampX(b.left+(b.width-f.offsetWidth)/2,f.offsetWidth),y=Math.max(8,q.bottom+2),at=`translate(${x}px,${y}px)`;
  f.style.transform=at;
  await play(f,[{transform:at+" scale(.6)",opacity:0},{transform:at+" scale(1.06)",opacity:1,offset:.7},{transform:at,opacity:1}],{duration:140,easing:"ease-out"});
  if(cls==="ok"){
    await wait(110);const [x2,y2]=centerOn(toRow,f);
    await play(f,[{transform:at},{transform:`translate(${x2}px,${y2}px) scale(.85)`,opacity:.95}],{duration:230,easing:"cubic-bezier(.5,0,.5,1)"});
  }else{
    await wait(cls==="warn"?650:cls==="dup"?380:200);
    await play(f,[{transform:at,opacity:1},{transform:at+" scale(.85)",opacity:0}],{duration:150,easing:"ease-in"});
  }
  f.remove();
}
function floater(txt,fromEl,toEl,cb){
  if(reduced){cb&&cb();return;}
  const p=document.createElement("div");p.className="plus";p.textContent=txt;document.body.appendChild(p);
  const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();
  const x0=a.left+a.width/2-20,y0=a.top,x1=b.left+b.width/2-20,y1=Math.max(0,b.top+b.height/2-12);
  play(p,[{transform:`translate(${x0}px,${y0}px)`,opacity:0},{transform:`translate(${x0}px,${y0-26}px)`,opacity:1,offset:.25},{transform:`translate(${x1}px,${y1}px) scale(.7)`,opacity:.85}],{duration:780,easing:"cubic-bezier(.5,0,.3,1)"}).then(()=>{p.remove();cb&&cb();});
}
function bumpCoins(){renderHud();const c=$("coins");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");}
let toastT;
function toast(msg){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},1900);}
function banner(up,sub){
  if(up&&up.newChap)applyChapter();renderHud();
  const c=chapter(S.level),el=document.createElement("div");el.className="banner";
  el.innerHTML='<div><b></b><span></span></div>';
  el.querySelector("b").textContent="NIVEAU "+S.level;
  el.querySelector("span").textContent=sub||(up&&up.newChap?"Nouveau décor : "+c.label:need(S.level)+" réponses pour le suivant");
  document.body.appendChild(el);setTimeout(()=>el.remove(),reduced?1600:2500);
}

/* ---------- actions ---------- */
function afterChange(ups){if(ups)banner(ups);if(isDone())setTimeout(setDoneUI,reduced?0:500);else renderKeys();}
function submit(){
  const inp=$("answer"),raw=inp.value.trim();
  if(!raw||isDone())return;inp.value="";
  const r=judge(raw);
  if(r.type==="ok"){
    S.cur.st[r.k]=1;S.coins+=10;const ups=progress(1);save();renderKeys();
    const row=$("slot"+r.k);
    launch(raw,"ok","",row.querySelector(".tiles")).then(()=>{paintSlot(r.k,true);floater("+10",row,$("coins"),bumpCoins);afterChange(ups);});
  }else{S.cur.miss=(S.cur.miss||0)+1;save();skipTick();}
  if(r.type==="ok"){}else if(r.type==="dup"){
    launch(raw,"dup","Déjà trouvée");
  }else if(r.type==="warn"){
    launch(raw,"warn","Bonne réponse, mais pas dans les 5");
  }else launch(raw,"bad","");
}
$("form").addEventListener("submit",e=>{e.preventDefault();submit();});
$("answer").addEventListener("beforeinput",e=>{if(e.data&&/^insert/.test(e.inputType)&&!isDone()&&blocked(e.data)){e.preventDefault();buzz();}});
document.addEventListener("keydown",e=>{
  if(!$("modal").hidden){if(e.key==="Escape")closeModal();return;}
  if(e.target===$("answer")||e.ctrlKey||e.metaKey||e.altKey||isDone())return;
  if(e.key==="Enter"){e.preventDefault();submit();}
  else if(e.key==="Backspace"){e.preventDefault();press("BS");}
  else if(e.key.length===1&&/[\p{L}\p{N}'’ -]/u.test(e.key)&&!(e.target.closest&&e.target.closest("button")&&e.key===" ")){e.preventDefault();if(blocked(e.key))buzz();else $("answer").value+=e.key;}
});
$("hintBtn").addEventListener("click",()=>{
  if(isDone()||S.coins<15)return;
  const free=false;S.coins-=15;let ups=null;const got=[];
  const base=c=>deacc(c).toUpperCase().replace(/[^A-Z0-9]/g,"")[0]||"";
  /* lettres encore cachées de chaque mot restant */
  const hidden={};S.cur.st.forEach((st,k)=>{if(st)return;const ch=[...ans(k).disp];
    hidden[k]=ch.map((c,i)=>i).filter(i=>!isGap(ch[i])&&base(ch[i])&&!S.cur.rev[k].includes(i)).map(i=>({i,l:base(ch[i])}));});
  /* la lettre présente dans le plus de mots gagne */
  const score={};Object.values(hidden).forEach(h=>new Set(h.map(x=>x.l)).forEach(l=>score[l]=(score[l]||0)+1));
  const best=Math.max(0,...Object.values(score)),pool=Object.keys(score).filter(l=>score[l]===best),L=pool[Math.floor(Math.random()*pool.length)];
  Object.entries(hidden).forEach(([k,h])=>{k=+k;if(!h.length)return;
    let pick=h.filter(x=>x.l===L).map(x=>x.i);
    if(!pick.length)pick=[h[Math.floor(Math.random()*h.length)].i];
    pick.forEach(i=>S.cur.rev[k].push(i));got.push([k,pick]);
    if(pick.length===h.length){S.cur.st[k]=2;const u=progress(1);ups=u||ups;}});
  save();bumpCoins();if(!free)floater("−15",$("coins"),$("hintBtn"));
  got.forEach(([k,p])=>paintSlot(k,true,p));
  if(L&&best>1)toast("Indice : toutes les « "+L+" »");
  afterChange(ups);
});
$("skipBtn").addEventListener("click",()=>{
  if(isDone()||S.coins<30)return;
  S.coins-=30;S.cur.st=S.cur.st.map(s=>s||3);save();bumpCoins();
  S.cur.st.forEach((s,k)=>{if(s===3)paintSlot(k,true);});setDoneUI();
});
function skipTick(){const b=$("skipBtn");if(!S.cur)return;
  const show=!isDone()&&(Date.now()-(S.cur.t0||Date.now())>=90000||(S.cur.miss||0)>=15);
  if(b.hidden===show)b.hidden=!show;b.disabled=S.coins<30;
  b.title=S.coins<30?"Il te faut 30 pièces":"";}
setInterval(skipTick,1000);
$("nextBtn").addEventListener("click",()=>{pickQ();renderQ();
  if(window.matchMedia&&matchMedia("(pointer:fine)").matches)$("answer").focus();});

/* ---------- export / import ---------- */
let pending=null;
const where=(L,P,C)=>"Niveau "+L+" · phase "+P+"/"+need(L)+" · "+C+" pièces";
function openModal(){
  $("mCode").textContent=CODEC.encode(S.level,S.phase,S.coins);$("mWhere").textContent=where(S.level,S.phase,Math.min(S.coins,81915));
  $("mMsg").textContent="";$("mMsg").className="msg";$("mConfirmRow").hidden=true;$("mResetRow").hidden=true;pending=null;
  $("modal").hidden=false;$("mCopy").focus();
}
function closeModal(){$("modal").hidden=true;}
$("saveBtn").addEventListener("click",openModal);
$("mClose").addEventListener("click",closeModal);
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal();});
$("mCopy").addEventListener("click",()=>{
  const c=$("mCode").textContent;
  const sel=()=>{const r=document.createRange();r.selectNodeContents($("mCode"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Code sélectionné : fais Ctrl+C");};
  try{navigator.clipboard.writeText(c).then(()=>{$("mCopy").textContent="Copié ✓";setTimeout(()=>$("mCopy").textContent="Copier le code",1500);},sel);}catch(e){sel();}
});
$("mInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("mLoad").click();});
$("mLoad").addEventListener("click",()=>{
  const v=$("mInput").value,d=CODEC.decode(v),m=$("mMsg");
  if(!d){pending=null;$("mConfirmRow").hidden=true;m.className="msg err";
    m.textContent=v.trim()?"Ce code ne marche pas. Vérifie les 3 blocs de lettres.":"Tape d'abord ton code.";return;}
  pending=d;m.className="msg okc";m.textContent="Code valide : "+where(d.level,d.phase,d.coins)+".";$("mConfirmRow").hidden=false;
});
$("mConfirm").addEventListener("click",()=>{
  if(!pending)return;Object.assign(S,{level:pending.level,phase:pending.phase,coins:pending.coins});pending=null;
  pickQ();applyChapter();renderQ();closeModal();$("mInput").value="";banner(null,"Partie chargée");
});
$("mReset").addEventListener("click",()=>{$("mResetRow").hidden=false;});
$("mResetYes").addEventListener("click",()=>{S=fresh();pickQ();applyChapter();renderQ();closeModal();banner(null,"C'est reparti de zéro");});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(sizeCells,100);});

/* ---------- démarrage ---------- */
function start(data){
  if(data&&data.S&&data.S.level)S=data.S;else load();
  const c=S.cur;
  if(!c||!BANK[c.id]||!Array.isArray(c.slots)||c.slots.length!==5||c.slots.some(i=>!BANK[c.id].cands[i])||!Array.isArray(c.st)||!Array.isArray(c.rev))pickQ();
  if(!S.cur.t0){S.cur.t0=Date.now();save();}
  buildKbd();applyChapter();renderQ();skipTick();
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({S}));
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
})();
</script>
</body></html>
